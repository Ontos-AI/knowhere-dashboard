name: Deploy Dashboard

on:
  push:
    branches:
      - staging
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

# Keep production migrations and deployments serialized. Publishing another release
# queues behind the active release instead of racing the same database migration.
concurrency:
  group: deploy-dashboard-${{ github.event_name == 'release' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VERCEL_CLI_VERSION: "59.1.3"
  VERCEL_ORG_ID: team_gnjAuB4uPlXycod3xUNGhzem
  VERCEL_PROJECT_ID: prj_vdlc45ZUPd8bWon6FxyIUq3Pxk8J
  DASHBOARD_APP_URL_PROD: https://knowhereto.ai
  DASHBOARD_APP_URL_STAGING: https://staging.knowhereto.ai
  DASHBOARD_API_URL_PROD: https://api.knowhereto.ai
  DASHBOARD_API_URL_STAGING: https://api-staging.knowhereto.ai
  DASHBOARD_AUTH_BASE_URL: /api/auth
  DASHBOARD_AUTH_COOKIE_DOMAIN_PROD: knowhereto.ai
  DASHBOARD_AUTH_COOKIE_DOMAIN_STAGING: staging.knowhereto.ai
  DASHBOARD_AUTH_COOKIE_PREFIX_PROD: better-auth
  DASHBOARD_AUTH_COOKIE_PREFIX_STAGING: better-auth-staging
  DASHBOARD_AUTH_ALLOWED_CALLBACK_ORIGINS_PROD: https://notebook.knowhereto.ai
  DASHBOARD_AUTH_ALLOWED_CALLBACK_ORIGINS_STAGING: https://notebook.staging.knowhereto.ai
  DASHBOARD_POSTHOG_HOST: https://us.i.posthog.com

jobs:
  migrate:
    name: Run main database migration
    runs-on: ubuntu-latest
    needs: validate-deployment-source
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run staging main database migration
        if: ${{ github.event_name != 'release' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Missing DATABASE_MIGRATION_URL repository secret"
            exit 1
          fi
          pnpm db:migrate

      # Production intentionally uses a separate migration credential. Falling
      # back to staging here could migrate the wrong database during a release.
      - name: Run production main database migration
        if: ${{ github.event_name == 'release' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL_PROD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Missing DATABASE_MIGRATION_URL_PROD repository secret"
            exit 1
          fi
          pnpm db:migrate

  validate-deployment-source:
    name: Validate deployment source
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic release tag
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          release_tag="${{ github.event.release.tag_name }}"
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'

          if [[ ! "$release_tag" =~ $semver_pattern ]]; then
            echo "::error::Dashboard releases must use semantic version tags like v1.0.1. Date-based tags such as 2026.06.26.1 or v2026.06.26.1 are not supported."
            exit 1
          fi

      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Verify production release source
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Release ${RELEASE_TAG} does not point to a commit on main"
            exit 1
          fi

  # The production project stays disconnected from Vercel Git auto-deployments.
  # Only a published release can reach this job, and the migration must finish first.
  deploy-vercel-production:
    name: Deploy Production to Vercel
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for variable_name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!variable_name}" ]; then
              missing+=("${variable_name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Vercel deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # Build remotely on Vercel so sensitive production environment variables
      # remain available to the Vercel build and are never pulled into CI.
      - name: Deploy production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy
          --project="${VERCEL_PROJECT_ID}"
          --scope=ontos-ai
          --prod
          --token="${VERCEL_TOKEN}"

  attach-release-assets:
    name: Attach Release Assets
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    needs: deploy-vercel-production
    permissions:
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Create source archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEPLOYED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          git archive --format=zip --output="release-assets/knowhere-dashboard-${RELEASE_TAG}-source.zip" "${DEPLOYED_SHA}"

          cat > release-assets/build-info.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "release_tag": "${RELEASE_TAG}",
            "deployed_commit": "${DEPLOYED_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            release-assets/knowhere-dashboard-${RELEASE_TAG}-source.zip \
            release-assets/build-info.json \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
