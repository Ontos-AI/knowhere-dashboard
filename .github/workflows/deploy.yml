name: Deploy to EKS

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      environment:
        description: '选择部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      tag:
        description: '镜像标签（可选）'
        required: false
        type: string

  # 自动触发 - 暂时注释掉 main 分支的自动触发，只保留 staging
  push:
    branches:
      - staging
    # - main  # 正式上线前先注释掉

env:
  # ECR 仓库配置
  ECR_REGISTRY: 107424103509.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: knowhere/knowhere-frontend
  
  # 项目名称
  PROJECT_NAME: knowhere-web
  
  # AWS 区域
  AWS_REGION: us-east-1
  # EKS 集群名称 - 请根据实际情况修改
  EKS_CLUSTER_NAME: knowhere-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # 根据触发方式确定部署环境
    environment: 
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Determine image tag
      id: image-tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
          echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          SHORT_SHA=${GITHUB_SHA::8}
          BRANCH=${GITHUB_REF_NAME}
          echo "TAG=${BRANCH}-${SHORT_SHA}-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
        fi
    
    - name: Set environment variables
      id: set-env
      run: |
        # 根据分支或手动输入确定环境
        if [[ "${{ github.ref_name }}" == "main" || "${{ github.event.inputs.environment }}" == "production" ]]; then
          echo "NAMESPACE=knowhere" >> $GITHUB_ENV
          echo "ENV_TYPE=production" >> $GITHUB_ENV
        else
          echo "NAMESPACE=knowhere-staging" >> $GITHUB_ENV
          echo "ENV_TYPE=staging" >> $GITHUB_ENV
        fi
        
        echo "Using namespace: $NAMESPACE"
        echo "Environment type: $ENV_TYPE"
    
    - name: Create temporary .env file for build
      run: |
        echo "Creating temporary .env file for $ENV_TYPE environment"
        
        # 根据环境类型选择对应的 Secret 内容
        if [ "$ENV_TYPE" = "production" ]; then
          ENV_CONTENT="${{ secrets.PRODUCTION_ENV_CONTENT }}"
          ENV_FILE=".env.production"
        else
          ENV_CONTENT="${{ secrets.STAGING_ENV_CONTENT }}"
          ENV_FILE=".env.staging"
        fi
        
        # 创建 .env 文件
        echo "$ENV_CONTENT" > $ENV_FILE
        echo "File content (with sensitive values masked):"
        cat "$ENV_FILE" | while IFS= read -r line; do
          if [[ "$line" =~ ^([A-Z_]+)=(.*)$ ]]; then
            key="${BASH_REMATCH[1]}"
            value="${BASH_REMATCH[2]}"
            if [[ "$key" =~ SECRET|KEY|PASSWORD|TOKEN ]]; then
              echo "$key=*** (length: ${#value})"
            else
              echo "$key=$value"
            fi
          else
            echo "$line"
          fi
        done
        if [ -f "$ENV_FILE" ]; then
          echo "✅ $ENV_FILE exists and is readable"
          echo "File size: $(wc -l < $ENV_FILE) lines"
          echo "RESEND_API_KEY exists: $(grep -q RESEND_API_KEY $ENV_FILE && echo "✅ Yes" || echo "❌ No")"
          
          # 显示 RESEND_API_KEY 的实际值（前10个字符用于调试）
          RESEND_KEY=$(grep RESEND_API_KEY "$ENV_FILE" | cut -d= -f2)
          if [ -n "$RESEND_KEY" ]; then
            echo "RESEND_API_KEY length: ${#RESEND_KEY}"
            echo "RESEND_API_KEY starts with: ${RESEND_KEY:0:10}..."
          fi
        else
          echo "❌ $ENV_FILE does not exist!"
          exit 1
        fi
        
        # 设置环境变量供后续步骤使用
        echo "ENV_FILE=$ENV_FILE" >> $GITHUB_ENV
    
    - name: Build and push Docker image
      run: |
        echo "Building Docker image with tag: ${{ steps.image-tag.outputs.TAG }}"
        echo "Using environment file: $ENV_FILE"
        
        # 构建 Docker 镜像，传递环境文件名作为构建参数
        docker build \
          --build-arg ENVIRONMENT=$ENV_FILE \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image-tag.outputs.TAG }} \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .
        
        # 推送镜像到 ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image-tag.outputs.TAG }}
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # 输出镜像信息
        echo "Image pushed to: $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image-tag.outputs.TAG }}"
        echo "IMAGE_FULL_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image-tag.outputs.TAG }}" >> $GITHUB_ENV
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubeconfig for EKS
      run: |
        # 更新 kubeconfig 以连接到 EKS 集群
        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $EKS_CLUSTER_NAME
        
        # 验证 kubectl 连接
        kubectl cluster-info
        kubectl get nodes
    
    - name: Check current deployment status
      run: |
        echo "Checking current deployment status in namespace: $NAMESPACE"
        
        # 检查 Deployment
        echo "=== Deployment Status ==="
        kubectl get deployment $PROJECT_NAME -n $NAMESPACE || echo "Deployment not found or error"
        
        # 检查 Pods
        echo ""
        echo "=== Pods Status ==="
        kubectl get pods -n $NAMESPACE -l app=$PROJECT_NAME 2>/dev/null || echo "No pods found"
        
        # 显示当前镜像
        echo ""
        echo "=== Current Image Version ==="
        CURRENT_IMAGE=$(kubectl get deployment $PROJECT_NAME -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "Unknown")
        echo "Current image: $CURRENT_IMAGE"
    
    - name: Update deployment with new image
      run: |
        echo "Updating deployment $PROJECT_NAME in namespace $NAMESPACE"
        echo "New image: $IMAGE_FULL_NAME"
        
        # 更新 Deployment 的镜像
        kubectl set image deployment/$PROJECT_NAME \
          $PROJECT_NAME=$IMAGE_FULL_NAME \
          -n $NAMESPACE
        
        echo "Deployment update initiated at: $(date)"
    
    - name: Wait for rollout to complete
      run: |
        echo "Waiting for deployment rollout to complete in namespace: $NAMESPACE"
        echo "Timeout: 300 seconds"
        
        # 等待部署完成，设置超时时间为5分钟
        kubectl rollout status deployment/$PROJECT_NAME \
          -n $NAMESPACE \
          --timeout=300s
        
        echo "✓ Deployment rollout completed successfully"
    
    - name: Verify deployment health
      run: |
        echo "Verifying deployment health in namespace: $NAMESPACE"
        
        # 检查 Deployment 状态
        echo "1. Checking deployment availability..."
        AVAILABLE=$(kubectl get deployment $PROJECT_NAME -n $NAMESPACE -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')
        
        if [ "$AVAILABLE" = "True" ]; then
          echo "✓ Deployment is Available"
        else
          echo "✗ Deployment is not Available"
          exit 1
        fi
        
        # 检查副本状态
        echo "2. Checking replica status..."
        DESIRED=$(kubectl get deployment $PROJECT_NAME -n $NAMESPACE -o jsonpath='{.spec.replicas}')
        READY=$(kubectl get deployment $PROJECT_NAME -n $NAMESPACE -o jsonpath='{.status.readyReplicas}')
        
        if [ "$READY" = "$DESIRED" ]; then
          echo "✓ All $DESIRED replicas are ready"
        else
          echo "✗ Only $READY out of $DESIRED replicas are ready"
          exit 1
        fi
        
        # 检查 Pod 状态
        echo "3. Checking pod status..."
        PODS=$(kubectl get pods -n $NAMESPACE -l app=$PROJECT_NAME -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
        
        ALL_HEALTHY=true
        for POD in $PODS; do
          PHASE=$(kubectl get pod $POD -n $NAMESPACE -o jsonpath='{.status.phase}')
          READY_STATUS=$(kubectl get pod $POD -n $NAMESPACE -o jsonpath='{.status.containerStatuses[0].ready}')
          
          if [ "$PHASE" = "Running" ] && [ "$READY_STATUS" = "true" ]; then
            echo "✓ Pod $POD: Running and Ready"
          else
            echo "✗ Pod $POD: Phase=$PHASE, Ready=$READY_STATUS"
            ALL_HEALTHY=false
          fi
        done
        
        if [ "$ALL_HEALTHY" = false ]; then
          echo "Some pods are not healthy. Checking logs..."
          
          # 检查有问题的 Pod 日志
          for POD in $PODS; do
            PHASE=$(kubectl get pod $POD -n $NAMESPACE -o jsonpath='{.status.phase}')
            if [ "$PHASE" != "Running" ]; then
              echo "=== Logs for pod $POD ==="
              kubectl logs $POD -n $NAMESPACE --tail=50 || echo "Could not retrieve logs"
            fi
          done
          
          exit 1
        fi
        
        # 显示最终镜像版本
        UPDATED_IMAGE=$(kubectl get deployment $PROJECT_NAME -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].image}')
        echo "✓ Deployment successfully updated with image: $UPDATED_IMAGE"
    
    - name: Clean up temporary files
      if: always()
      run: |
        echo "Cleaning up temporary .env files..."
        rm -f .env.production .env.staging 2>/dev/null || true
    
    - name: Display final status
      run: |
        echo "========================================"
        echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
        echo "========================================"
        echo "Environment: $NAMESPACE"
        echo "Deployment: $PROJECT_NAME"
        echo "Image: $IMAGE_FULL_NAME"
        echo "Time: $(date)"
        echo "========================================"
        
        # 显示最终状态
        echo ""
        echo "Final deployment status:"
        kubectl get deployment $PROJECT_NAME -n $NAMESPACE -o wide
        
        echo ""
        echo "Pod status:"
        kubectl get pods -n $NAMESPACE -l app=$PROJECT_NAME -o wide
        
        echo ""
        echo "Service status:"
        kubectl get service $PROJECT_NAME -n $NAMESPACE -o wide
    
    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed! Attempting rollback..."
        echo "Namespace: $NAMESPACE"
        
        # 检查 Deployment 是否存在
        if kubectl get deployment $PROJECT_NAME -n $NAMESPACE > /dev/null 2>&1; then
          echo "Rolling back deployment $PROJECT_NAME in namespace $NAMESPACE"
          
          # 回滚到上一个版本
          if kubectl rollout undo deployment/$PROJECT_NAME -n $NAMESPACE; then
            echo "Rollback command executed successfully"
            
            # 等待回滚完成
            if kubectl rollout status deployment/$PROJECT_NAME -n $NAMESPACE --timeout=180s; then
              echo "✓ Rollback completed successfully"
            else
              echo "⚠️ Rollback status check failed or timed out"
            fi
          else
            echo "✗ Failed to execute rollback command"
          fi
          
          # 显示当前状态
          echo ""
          echo "Status after rollback attempt:"
          kubectl get deployment $PROJECT_NAME -n $NAMESPACE
          echo ""
          kubectl get pods -n $NAMESPACE -l app=$PROJECT_NAME
        else
          echo "⚠️ Deployment $PROJECT_NAME not found in namespace $NAMESPACE"
        fi
        
        # 输出错误信息以便调试
        echo ""
        echo "=== Debug Information ==="
        echo "Last few events in namespace:"
        kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' | tail -20
        
        echo ""
        echo "Deployment details:"
        kubectl describe deployment $PROJECT_NAME -n $NAMESPACE 2>/dev/null || echo "Cannot describe deployment"
